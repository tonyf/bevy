name: BSN fuzz

# Coverage-guided fuzzing of the bevy_bsn parser/printer. Scheduled rather than
# per-PR: the deterministic in-tree fuzz loops (bevy_bsn's adversarial tests) run on
# every PR already; this job hunts deeper with libFuzzer on a nightly cadence.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [parse, roundtrip, render]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        working-directory: crates/bevy_bsn/fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bsn-fuzz-artifacts-${{ matrix.target }}
          path: crates/bevy_bsn/fuzz/artifacts/
          if-no-files-found: ignore
